<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store">
    <title>DePix · Spark Wallet</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/wallet.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/dropdown.css">
    <base target="_blank">
  </head>
  <body>
    <div class="app">
      <h1>
        <span class="dp">
          <span class="de">De</span><span class="pix">Pix</span></span> · Spark Wallet
      </h1>
      <div class="card" id="connectCard">
        <div class="mnemonic-help">
          Não tem uma frase?
          <a href="https://iancoleman.io/bip39/" target="_blank" rel="noopener noreferrer">
            Use Iancoleman
          </a>
        </div>
        <label for="mnemonic"> Frase de recuperação (12 ou 24 palavras) </label>
        <textarea id="mnemonic" placeholder="palavra1 palavra2 palavra3 ..."></textarea>
        <div class="spacer"></div>
        <label for="pwdNew"> Crie uma senha </label>
          <div class="input-with-btn">
            <input type="password" id="pwdNew" placeholder="mínimo 4 caracteres" autocomplete="new-password">
            <button type="button" id="btnTogglePwdNew" class="btn-icon" title="Mostrar senha">
              <svg class="eye-open" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-closed" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>

          <div class="input-with-btn">
            <input type="password" id="pwdNewConfirm" placeholder="repita a senha" autocomplete="new-password">
            <button type="button" id="btnTogglePwdConfirm" class="btn-icon" title="Mostrar senha">
              <svg class="eye-open" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-closed" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        <button id="btnConnect" class="btn-primary"> Salvar e conectar </button>
        <div class="log" id="connectLog"></div>
      </div>
      <div class="card hidden" id="unlockCard">
        <label class="card-title"> Carteira encontrada neste navegador </label>
        <div class="spacer"></div>
        <input type="password" id="pwdUnlock" placeholder="Digite sua senha" autocomplete="current-password">
        <button id="btnUnlock" class="btn-primary"> Desbloquear carteira </button>
        <button id="btnWipeUnlock" class="btn-danger"> Apagar carteira salva </button>
        <div class="log" id="unlockLog"></div>
      </div>
      <div id="walletView" class="hidden">
        <div class="tab-bar">
          <button class="tab-btn active" data-tab="saldo">Saldo & Ações</button>
          <button class="tab-btn" data-tab="claims">Claims <span class="badge hidden" id="claimsBadge">0</span></button>
          <button class="tab-btn" data-tab="historico">Histórico</button>
        </div>

        <div class="tab-panel active" id="tabPanelSaldo">
          <div class="card">
            <div class="balrow">
              <span class="lbl">BTC (sats)</span>
              <span class="val val-btc" id="btcBal">—</span>
              <div class="bal-sub" id="btcFiat"></div>
            </div>
            <div class="balrow">
              <span class="lbl">DePix</span>
              <span class="val val-dpx" id="depixBal">—</span>
              <div class="bal-sub" id="depixFiat"></div>
            </div>
            <button class="btn-secondary" id="btnRefresh"> Atualizar saldo </button>
            <div class="addr-box">
              <div class="addr-label"> Seu endereço Spark </div>
              <div class="addr-value" id="sparkAddr"> — </div>
              <button class="btn-secondary" id="btnQrSpark"> Ver QR Code </button>
              <button class="btn-secondary btn-copy" id="btnCopyAddr"> Copiar endereço </button>
            </div>
            <div class="addr-box" style="margin-top: 14px;">
              <div class="addr-label"> Depositar BTC on-chain </div>
              <div class="addr-value" id="depositAddr"> — </div>
              <button class="btn-secondary" id="btnQrDeposit"> Ver QR Code </button>
              <button class="btn-secondary btn-copy" id="btnCopyDeposit"> Copiar endereço de depósito </button>
            </div>
          </div>

          <div class="card" id="actionCard">
            <label class="card-title" for="actionMode"> Ação </label>
            <div class="spacer"></div>
            <label for="actionMode"> Tipo </label>
            <select id="actionMode">
              <option value="swap"> Swap </option>
              <option value="send"> Envio </option>
              <option value="receive"> Receber (Invoice) </option>
              <option value="exit"> Exit </option>
            </select>
            <div id="swapSection">
              <label for="swapDir"> Direção </label>
              <select id="swapDir">
                <option value="depixToBtc"> DePix → BTC </option>
                <option value="btcToDepix"> BTC → DePix </option>
              </select>
              <label for="amountIn" id="amountLabel"> Quantidade de DePix </label>
              <input type="number" id="amountIn" min="0" step="any" placeholder="ex: 1.5">
              <div class="row row-gap-top">
                <div>
                  <label for="slippage"> Slippage (%) </label>
                  <input type="number" id="slippage" value="1" min="0.1" step="0.1">
                </div>
                <div class="btn-quote-wrap">
                  <button class="btn-secondary btn-quote" id="btnQuote"> Simular </button>
                </div>
              </div>
              <div class="quote" id="quoteBox"></div>
              <button id="btnSwap" class="btn-primary" disabled> Executar swap </button>
            </div>

            <div id="sendSection" class="hidden">
              <label for="sendTo"> Endereço de destino </label>
              <div class="input-with-btn">
                <input type="text" id="sendTo" placeholder="spark1... | lnbc... | user@domain">
                <button type="button" id="btnScanQr" class="btn-icon" title="Ler QR Code">
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
                    <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
                    <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
                    <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
                    <rect x="7" y="7" width="3" height="3"/>
                    <rect x="14" y="7" width="3" height="3"/>
                    <rect x="7" y="14" width="3" height="3"/>
                    <path d="M14 14h3v3h-3z"/>
                  </svg>
                </button>
              </div>

              <div id="sendDynamicFields" class="hidden">
                <label for="sendAsset"> Ativo </label>
                <select id="sendAsset">
                  <option value="btc"> BTC (sats) </option>
                  <option value="depix"> DePix </option>
                </select>

                <label for="sendAmount" id="sendAmountLabel"> Quantidade de sats </label>
                <input type="number" id="sendAmount" min="0" step="any" placeholder="ex: 5000">
              </div>

              <button id="btnSend" class="btn-primary"> Enviar </button>
            </div>

            <div id="receiveSection" class="hidden">
              <label for="receiveAmount"> Quantidade de sats (fixa na invoice) </label>
              <input type="number" id="receiveAmount" min="1" step="1" placeholder="ex: 5000">
              <label for="receiveMemo"> Memo (opcional) </label>
              <input type="text" id="receiveMemo" placeholder="Descrição do pagamento" maxlength="120">
              <button id="btnCreateInvoice" class="btn-primary"> Gerar Spark Invoice </button>
              <div id="invoiceBox" class="hidden invoice-box">
                <div class="qr-wrap">
                  <canvas id="invoiceQr"></canvas>
                </div>
                <label> String da invoice </label>
                <textarea id="invoiceString" readonly rows="4"></textarea>
                <div class="row row-gap-top">
                  <button class="btn-secondary btn-copy" id="btnCopyInvoice"> Copiar invoice </button>
                  <button class="btn-secondary" id="btnNewInvoice"> Nova invoice </button>
                </div>
              </div>
            </div>
            <div id="exitSection" class="hidden">
              <label for="exitAmount"> Quantidade de sats </label>
              <input type="number" id="exitAmount" min="1" step="1" placeholder="ex: 50000">
              <label for="exitAddress"> Endereço on-chain de destino </label>
              <input type="text" id="exitAddress" placeholder="bc1q... ou bc1p...">
              <label for="exitSpeed"> Velocidade </label>
              <select id="exitSpeed">
                <option value="FAST"> Rápida (mais cara) </option>
                <option value="MEDIUM" selected> Média </option>
                <option value="SLOW"> Lenta (mais barata) </option>
              </select>
              <button id="btnExitQuote" class="btn-secondary"> Simular taxa </button>
              <div class="quote" id="exitQuoteBox"></div>
              <button id="btnExit" class="btn-primary" disabled> Executar Exit </button>
            </div>
            <div class="log" id="swapLog"></div>
          </div>
        </div>

        <div class="tab-panel" id="tabPanelClaims">
          <button class="btn-secondary" id="btnCheckClaims"> Verificar claims </button>
          <div class="card hidden" id="onchainClaimsCard">
            <label class="card-title"> Reivindicar depósitos </label>
            <div id="onchainDeposits" class="deposit-list"></div>
          </div>
          <div class="card" id="noClaimsCard">
            <label class="card-title"> Reivindicar depósitos </label>
            <p class="tx-meta" style="text-align:center; margin-top:8px;">Nenhum depósito on-chain pendente.</p>
          </div>
        </div>

        <div class="tab-panel" id="tabPanelHistorico">
          <div class="card">
            <label class="card-title"> Histórico de transações </label>
            <button class="btn-secondary" id="btnRefreshTx"> Atualizar histórico </button>
            <div id="txList" class="tx-list"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="qrModal" class="qr-modal hidden">
      <div class="qr-modal-content">
        <button id="btnQrModalClose" class="qr-modal-close" aria-label="Fechar">×</button>
        <div class="qr-modal-label" id="qrModalLabel"></div>
        <div class="qr-wrap">
          <canvas id="qrModalCanvas"></canvas>
        </div>
        <div class="qr-modal-addr" id="qrModalAddr"></div>
      </div>
    </div>

    <div id="lnbcModal" class="qr-modal hidden">
      <div class="qr-modal-content lnbc-modal-content">
        <button id="lnbcModalClose" class="qr-modal-close" aria-label="Fechar">×</button>
        <div class="qr-modal-label">Confirmar pagamento Lightning</div>

        <div class="lnbc-info" id="lnbcInfo"></div>

        <label class="lnbc-confirm-label">
          <input type="checkbox" id="lnbcConfirmCheck">
          <span>Eu conferi os dados acima e confirmo o envio.</span>
        </label>

        <div class="lnbc-actions">
          <button id="lnbcCancel" class="btn-secondary">Cancelar</button>
          <button id="lnbcConfirm" class="btn-primary" disabled>Enviar</button>
        </div>

        <div class="log" id="lnbcLog"></div>
      </div>
    </div>

    <div id="sparkInvoiceModal" class="qr-modal hidden">
      <div class="qr-modal-content lnbc-modal-content">
        <button id="sparkInvoiceModalClose" class="qr-modal-close" aria-label="Fechar">×</button>
        <div class="qr-modal-label">Confirmar pagamento Spark</div>

        <div class="lnbc-info" id="sparkInvoiceInfo"></div>

        <label class="lnbc-confirm-label">
          <input type="checkbox" id="sparkInvoiceConfirmCheck">
          <span>Eu conferi os dados acima e confirmo o envio.</span>
        </label>

        <div class="lnbc-actions">
          <button id="sparkInvoiceCancel" class="btn-secondary">Cancelar</button>
          <button id="sparkInvoiceConfirm" class="btn-primary" disabled>Enviar</button>
        </div>

        <div class="log" id="sparkInvoiceLog"></div>
      </div>
    </div>

    <div id="txDetailModal" class="qr-modal hidden">
      <div class="qr-modal-content tx-detail-modal-content">
        <button id="txDetailModalClose" class="qr-modal-close" aria-label="Fechar">×</button>
        <div class="qr-modal-label">Detalhes da transação</div>
        <div class="tx-detail-info" id="txDetailInfo">
          <div class="tx-meta">Carregando…</div>
        </div>
      </div>
    </div>

    <div id="scanModal" class="qr-modal hidden">
      <div class="qr-modal-content scan-modal-content">
        <button id="scanModalClose" class="qr-modal-close" aria-label="Fechar">×</button>
        <div class="qr-modal-label">Aponte a câmera para o QR Code</div>
        <div id="scanReader" class="scan-reader"></div>
        <button id="scanFromFile" class="btn-secondary">Carregar imagem do QR</button>
        <input type="file" id="scanFileInput" accept="image/*" hidden>
        <div class="log" id="scanLog"></div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.legacy.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
